name: Daily Real Estate News

# 매일 아침 07:00 KST(=22:00 UTC 전날)에 뉴스 수집·리포트·커밋·텔레그램 발송.
# 키는 저장소 Secrets에서 읽는다: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET,
# TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
on:
  schedule:
    - cron: "0 22 * * *"      # 07:00 Asia/Seoul
  workflow_dispatch: {}        # 수동 실행(테스트) 버튼

permissions:
  contents: write              # 빌드 결과를 저장소에 커밋하기 위함

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TZ: Asia/Seoul
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # 의존성 없음(전부 stdlib) → pip install 불필요

      - name: 빌드 (수집 → 적재 → 리포트)
        run: python scripts/build.py

      # 발송이 커밋보다 먼저다. 알림 스크립트가 "발송됨" 표시를 DB에 쓰는데, 커밋이 먼저면
      # 그 표시가 .gz에 안 담겨 다음날 같은 알림이 또 나간다(9/23까지 실제로 그랬다).
      - name: 텔레그램 요약 발송
        run: python .claude/skills/news-telegram/scripts/send_digest.py

      - name: 관심물건 알림 (있으면)
        run: python .claude/skills/news-telegram/scripts/watch_alert.py

      # 신통기획 확정 등 사업 단계 이벤트. 사업당 1회만 울린다(config/watchlist.json의 event_alerts)
      - name: 사업 단계 이벤트 알림 (있으면)
        run: python .claude/skills/news-telegram/scripts/event_alert.py

      - name: DB 재패킹 (알림 발송 상태 반영)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.claude/skills/news-curation/scripts')
          import db as D
          print(f"news.db.gz {D.deflate()/1e6:.1f} MB")
          PY

      # DB는 gzip(news.db.gz)만 커밋한다 — 원본 SQLite가 GitHub 100MB 한도를 넘어
      # 2026-09-10부터 7일간 푸시가 실패했었다. 커밋 실패가 잡을 빨간불로 남도록
      # continue-on-error로 두고 맨 끝에서 실패를 다시 올린다.
      - name: 결과 커밋 (DB.gz·리포트)
        id: commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --cached -q data/news.db 2>/dev/null || true
          git add -f data/news.db.gz reports/ || true
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 데일리 뉴스 $(date +%Y-%m-%d)"
            git push
          fi

      - name: 커밋 실패 시 잡을 실패로 표시
        if: steps.commit.outcome == 'failure'
        run: |
          echo "::error::결과 커밋/푸시 실패 — DB 누적이 끊긴다. 로그의 git 오류를 확인할 것"
          exit 1
